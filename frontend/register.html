<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — Found & Co.</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="site-header-inner">
    <a href="index.html" class="brand">
      <span class="display">Found &amp; Co.</span>
      <span class="tag">GCTU Board</span>
    </a>
    <nav class="main-nav">
      <a href="index.html" data-nav="feed">Feed</a>
      <a href="dashboard.html" data-nav="dashboard" id="nav-dashboard" style="display:none;">My Posts</a>
    </nav>
    <div class="header-actions">
      <span id="user-chip"></span>
      <a href="login.html" id="nav-login" class="btn btn-sm">Log in</a>
    </div>
  </div>
</header>

<main class="auth-wrap">
  <div class="auth-card">
    <h1>Create an account</h1>
    <p class="form-note">Use your student email to register.</p>

    <form id="register-form">
      <div class="form-error" id="register-error"></div>
      <div class="field" style="margin-bottom:14px;">
        <label for="r-name">Full name</label>
        <input type="text" id="r-name" required placeholder="Ama Boateng">
      </div>
      <div class="field" style="margin-bottom:14px;">
        <label for="r-email">Email</label>
        <input type="email" id="r-email" required placeholder="you@gctu.edu.gh">
      </div>
      <div class="field" style="margin-bottom:18px;">
        <label for="r-password">Password</label>
        <input type="password" id="r-password" required placeholder="At least 8 characters">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Create account</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
  </div>
</main>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
